version: "2"
linters:
  enable:
    - bodyclose
    - errorlint
    - misspell
    - revive
    - rowserrcheck
    - sqlclosecheck
    - unparam
  settings:
    revive:
      rules:
        - name: unused-parameter
          disabled: true
  exclusions:
    generated: lax
    presets:
      - common-false-positives
      - legacy
      - std-error-handling
